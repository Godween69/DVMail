<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DVMail: ящики</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Ящики DVMail</h1>

    <!-- Вход -->
    <section id="view-login" hidden>
      <form id="form-login" autocomplete="off">
        <label for="login-password">Пароль админки</label>
        <input id="login-password" type="password" required maxlength="256" autocomplete="current-password">
        <button type="submit">Войти</button>
      </form>
    </section>

    <!-- Основной экран -->
    <section id="view-main" hidden>
      <div class="bar">
        <span id="domain"></span>
        <button id="btn-logout" type="button" class="link">Выйти</button>
      </div>

      <h2>Ящики</h2>
      <ul id="list" class="list"></ul>

      <h2>Новый ящик</h2>
      <form id="form-create" autocomplete="off">
        <label for="new-name">Имя (до @)</label>
        <input id="new-name" required maxlength="31" pattern="[a-z0-9][a-z0-9._\-]{1,30}" placeholder="например, anna">
        <label for="new-desc">Описание (необязательно)</label>
        <input id="new-desc" maxlength="100" placeholder="например, Анна">
        <button type="submit">Создать</button>
      </form>

      <!-- Пароль нового ящика: показывается один раз -->
      <div id="result" class="result" hidden>
        <p><strong id="result-email"></strong></p>
        <p>Пароль показывается один раз. Скопируйте его в менеджер паролей.</p>
        <p><code id="result-password"></code></p>
        <p id="result-note"></p>
        <button id="btn-copy" type="button">Копировать</button>
        <button id="btn-hide" type="button" class="link">Скрыть</button>
      </div>
    </section>

    <p id="message" role="status"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
